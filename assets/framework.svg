<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DPE-Former overview</title>
  <desc id="desc">An encoder produces embeddings, diverse prototype heads produce complementary predictions, and a transformer aggregates them.</desc>
  <defs>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f766e"/><stop offset="1" stop-color="#164e63"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f8fafc"/>
  <text x="58" y="62" fill="#0f172a" font-family="Arial, sans-serif" font-size="27" font-weight="700">DPE-Former</text>
  <text x="58" y="91" fill="#64748b" font-family="Arial, sans-serif" font-size="17">Fairness-oriented learning under hidden subpopulation shift</text>
  <g filter="url(#shadow)">
    <rect x="58" y="130" width="270" height="162" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <rect x="58" y="130" width="270" height="11" rx="5" fill="url(#ink)"/>
    <circle cx="104" cy="190" r="25" fill="#ccfbf1"/><path d="M91 184h26v13H91zM97 174h14v10H97zM97 203h14v10H97z" fill="#0f766e"/>
    <text x="145" y="188" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">1. Encoder</text>
    <text x="92" y="237" fill="#475569" font-family="Arial, sans-serif" font-size="16">Learn patient representations</text>
    <text x="92" y="261" fill="#475569" font-family="Arial, sans-serif" font-size="16">with supervised training</text>
  </g>
  <path d="M346 212H438" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="456" y="130" width="306" height="162" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <rect x="456" y="130" width="306" height="11" rx="5" fill="#d97706"/>
    <text x="490" y="178" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">2. Diverse prototypes</text>
    <g fill="#fef3c7" stroke="#d97706" stroke-width="2"><circle cx="509" cy="221" r="20"/><circle cx="562" cy="241" r="20"/><circle cx="615" cy="211" r="20"/><circle cx="668" cy="239" r="20"/></g>
    <g fill="#92400e" font-family="Arial, sans-serif" font-size="15" font-weight="700"><text x="503" y="226">P1</text><text x="556" y="246">P2</text><text x="609" y="216">P3</text><text x="662" y="244">P4</text></g>
    <text x="491" y="272" fill="#475569" font-family="Arial, sans-serif" font-size="15">Complementary decision patterns</text>
  </g>
  <path d="M780 212H872" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="890" y="130" width="252" height="162" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <rect x="890" y="130" width="252" height="11" rx="5" fill="#7c3aed"/>
    <text x="923" y="181" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">3. Transformer</text>
    <path d="M933 228h44M990 211v52M1008 211v52M1026 211v52M1044 211v52M1062 228h43" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
    <circle cx="991" cy="211" r="7" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><circle cx="1008" cy="240" r="7" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><circle cx="1026" cy="221" r="7" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/><circle cx="1044" cy="249" r="7" fill="#ddd6fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="922" y="273" fill="#475569" font-family="Arial, sans-serif" font-size="15">Adaptive aggregation</text>
  </g>
</svg>
